services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrioptix
      POSTGRES_USER: agrioptix
      POSTGRES_PASSWORD: agrioptix
    ports: ["5432:5432"]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://agrioptix:agrioptix@db:5432/agrioptix
    depends_on: [db]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
